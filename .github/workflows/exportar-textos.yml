# Exporta os textos publicados no Sanity para um arquivo JSON (só leitura).
# Rode manualmente em Actions → "Exportar textos" → Run workflow.
name: Exportar textos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar textos no Sanity
        run: |
          Q='{
            "settings": *[_id == "siteSettings"][0],
            "order": *[_id == "projectOrder"][0].projects[]._ref,
            "projects": *[_type == "project" && !(_id in path("drafts.**"))]{
              _id, title, "slug": slug.current, year, client, agency, type, role, description, team, recognition,
              content[]{ _type, caption, heading, body, url }
            }
          }'
          curl -sS -G "https://cctrc9we.api.sanity.io/v2025-01-01/data/query/production" --data-urlencode "query=$Q" -o textos.json
          head -c 300 textos.json
      - name: Guardar no ramo "exportacao-textos" (não afeta o site)
        run: |
          git init -q out && cd out
          git config user.name "github-actions" && git config user.email "actions@github.com"
          cp ../textos.json . && git add textos.json && git commit -qm "Textos exportados"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:exportacao-textos
